spring.application.name=ai-customer-support-backend
server.port=${PORT:8080}

# Database credentials are required through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.registration.allow-agent-signup=${ALLOW_AGENT_SIGNUP:true}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.demo.password=${DEMO_PASSWORD:}
